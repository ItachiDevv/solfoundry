# Anchor Pipeline -- Solana contract build + test
#
# Runs only when files in contracts/ or Anchor.toml are modified.
# Installs Solana CLI, Anchor CLI, and runs build + test against devnet.
#
# NOTE: This workflow will naturally be skipped on PRs that do not touch
# contract code, thanks to the paths filter.

name: Anchor

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "contracts/**"
      - "Anchor.toml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "Anchor.toml"

concurrency:
  group: anchor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anchor-build-test:
    name: "Anchor Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -- Solana CLI --
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify Solana version
        run: solana --version

      # -- Anchor CLI via AVM (Anchor Version Manager) --
      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install latest
          avm use latest

      - name: Verify Anchor version
        run: anchor --version

      # -- Rust toolchain --
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # -- Node (for Anchor tests written in TypeScript) --
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS test dependencies
        run: npm install
        if: hashFiles('package.json') != ''

      # -- Configure Solana for devnet --
      - name: Configure Solana CLI
        run: |
          solana config set --url https://api.devnet.solana.com
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json
          solana airdrop 2 || echo "::warning::Devnet airdrop failed"

      # -- Build all Anchor programs --
      - name: Anchor build
        run: anchor build

      # -- Run Anchor test suite --
      - name: Anchor test
        run: anchor test --skip-local-validator
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: ~/.config/solana/id.json
