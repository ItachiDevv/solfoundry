# CI Pipeline -- Continuous Integration for SolFoundry monorepo
#
# Runs on every pull request and push to main.
# Validates frontend (Node/TypeScript), backend (Python/FastAPI),
# and Solana contracts (Rust/Anchor) when present.
#
# Design decisions:
#   - Frontend and backend run as separate jobs for clear failure isolation.
#   - Each step uses continue-on-error: false (default) so failures are visible.
#   - The contracts job is skipped when contracts/Cargo.toml does not exist yet,
#     since the contracts directory is scaffolded but not yet populated.
#   - Uses npm install instead of npm ci because lock file may not exist
#     during early development.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Frontend: install, lint, type-check, test, build
  # All steps in one job to avoid redundant npm installs.
  # ----------------------------------------------------------------
  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Use npm install -- lock file may not be committed yet during early dev.
      # Switch to npm ci once package-lock.json is committed.
      - name: Install dependencies
        run: npm install

      # Lint with ESLint -- runs if lint script is defined in package.json.
      - name: Lint (ESLint)
        run: npm run lint --if-present

      # TypeScript type checking without emitting files
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      # Run Vitest unit tests
      - name: Unit tests (Vitest)
        run: npm run test --if-present

      # Production build to catch build-time errors
      - name: Build
        run: npm run build

  # ----------------------------------------------------------------
  # Backend: install, lint, test
  # Python/FastAPI with Ruff for linting and pytest for tests.
  # ----------------------------------------------------------------
  backend:
    name: "Backend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      # Ruff: fast Python linter -- checks style and common errors
      - name: Lint (Ruff)
        run: ruff check .

      # Ruff format check -- ensures consistent code formatting
      - name: Format check (Ruff)
        run: ruff format --check .

      # Run pytest against backend/tests/
      - name: Unit tests (pytest)
        run: pytest tests/ -v

  # ----------------------------------------------------------------
  # Contracts: Clippy + build (Rust/Solana)
  # Only runs when contracts/Cargo.toml exists -- the contracts
  # directory is currently scaffolded but empty.
  # ----------------------------------------------------------------
  contracts:
    name: "Contracts"
    runs-on: ubuntu-latest
    if: hashFiles('contracts/Cargo.toml') != ''
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Lint (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check (rustfmt)
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --release
