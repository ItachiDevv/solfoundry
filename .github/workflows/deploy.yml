# Deploy Pipeline -- runs on merge to main
#
# Deploys frontend to Vercel and backend to a DigitalOcean droplet via Docker.
#
# IMPORTANT: This workflow requires secrets to be configured in the repository.
# Both jobs check the DEPLOY_ENABLED repository variable before running.
# See docs/CI_CD.md for setup instructions.

name: Deploy

on:
  push:
    branches: [main]

# Never cancel an in-progress deploy -- partial deploys are dangerous
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------
  # Frontend -> Vercel
  #
  # Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # Skipped unless DEPLOY_ENABLED variable is set to 'true'.
  # ----------------------------------------------------------------
  deploy-frontend:
    name: "Deploy Frontend -> Vercel"
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: frontend

  # ----------------------------------------------------------------
  # Backend -> Docker -> DigitalOcean Droplet
  #
  # Requires: DO_HOST, DO_USERNAME, DO_SSH_KEY
  # Builds a Docker image, pushes to GHCR, then deploys via SSH.
  # Skipped unless DEPLOY_ENABLED variable is set to 'true'.
  # ----------------------------------------------------------------
  deploy-backend:
    name: "Deploy Backend -> DO Droplet"
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR login uses the built-in GITHUB_TOKEN -- no extra secret needed
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to DigitalOcean droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}/backend:latest
            docker stop solfoundry-backend || true
            docker rm solfoundry-backend || true
            docker run -d \
              --name solfoundry-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /opt/solfoundry/.env \
              ghcr.io/${{ github.repository }}/backend:latest
